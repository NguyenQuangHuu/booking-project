<div class="overlay">
  <div class="popup">
    <div class="popup__header">
      <div class="popup__header--content">{{ this.configForm().formName }}</div>
      <button (click)="onCancel()" class="popup__header--closed-button" type="button">x</button>
    </div>
    <form [formGroup]="formGroup" class="popup__content">

      @for (field of configForm().fields; track field.name) {
        <div class="popup__content--form-input">
          <label [for]="field.name">{{ field.label }}</label>
          @switch (field.type) {
            @case ('select') {
              <select [id]="field.name" [formControlName]="field.name">
                @for (option of field.options; track option.value) {
                  <option [value]="option.value">{{ option.label }}</option>
                }
              </select>
            }
            @case ('textarea') {
              <textarea
                [id]="field.name"
                [formControlName]="field.name"
                [placeholder]="field.placeholder || ''"
              ></textarea>
            }
            @default {
              <input
                [id]="field.name"
                [type]="field.type"
                [formControlName]="field.name"
                [placeholder]="field.placeholder || ''"
              >
            }
          }
        </div>
      }

    </form>
    <div class="popup__action">
      @if (showCancel()) {
        <button type="button" (click)="onCancel()" class="popup__action--cancel">
          {{ configForm().cancelButtonText || 'Cancel' }}
        </button>
      }
      <button [disabled]="!formGroup.valid || isSubmitting()" class="popup__action--submit" type="submit">
        {{ configForm().submitButtonText || 'Submit' }}
        @if (isSubmitting()) {
          <span class="popup__spinner"></span>
        }
      </button>
    </div>
  </div>
</div>
