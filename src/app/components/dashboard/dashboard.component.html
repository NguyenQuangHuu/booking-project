<div>
  <div>
    <button (click)="isActive()">New Lesson</button>
  </div>
  <div>
    @if (openBox()) {
      <app-popup-form
        [configForm]="wordForm"
        [showCancel]="true"
        [isSubmitting]="isSubmitting()"
        (submitted)="handleSubmit()"
        (canceled)="handleCancel()"
      ></app-popup-form>
    }
  </div>
</div>
